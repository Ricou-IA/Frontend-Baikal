
[functions.ingest-documents]
enabled = true
verify_jwt = true
import_map = "./functions/ingest-documents/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ingest-documents/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ingest-documents/*.html" ]

# verify_jwt explicite : la cle anon (JWT valide) suffit a passer la gateway ;
# le controle d'appartenance org/projet reste a implementer dans le code (P0 audit).
[functions.baikal-retrieval]
enabled = true
verify_jwt = true
import_map = "./functions/import_map.json"
entrypoint = "./functions/baikal-retrieval/index.ts"

[functions.trigger-ingestion]
enabled = true
verify_jwt = true
import_map = "./functions/import_map.json"
entrypoint = "./functions/trigger-ingestion/index.ts"

[functions.admin-partenariats]
enabled = true
verify_jwt = true
import_map = "./functions/import_map.json"
entrypoint = "./functions/admin-partenariats/index.ts"

[functions.admin-site-stats]
enabled = true
verify_jwt = true
import_map = "./functions/import_map.json"
entrypoint = "./functions/admin-site-stats/index.ts"

[functions.admin-droits]
enabled = true
verify_jwt = true
import_map = "./functions/import_map.json"
entrypoint = "./functions/admin-droits/index.ts"

[functions.admin-comptes]
enabled = true
verify_jwt = true
import_map = "./functions/import_map.json"
entrypoint = "./functions/admin-comptes/index.ts"

# Archivage SEO appele par pg_cron : pas de JWT, auth par X-Cron-Secret.
[functions.admin-seo-snapshot]
enabled = true
verify_jwt = false
import_map = "./functions/import_map.json"
entrypoint = "./functions/admin-seo-snapshot/index.ts"

# Lien public de desinscription (GET affiche / POST execute) : pas de JWT,
# la securite est le token HMAC dans l'URL.
[functions.admin-desinscription]
enabled = true
verify_jwt = false
import_map = "./functions/import_map.json"
entrypoint = "./functions/admin-desinscription/index.ts"

# Demandes d'acces deposees depuis la landing publique : pas de JWT pour le
# depot (honeypot + limite par IP), session super_admin exigee dans le code
# pour lister et suivre.
[functions.baikal-demande]
enabled = true
verify_jwt = false
import_map = "./functions/import_map.json"
entrypoint = "./functions/baikal-demande/index.ts"
